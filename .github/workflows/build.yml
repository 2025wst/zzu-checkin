name: build-checkin-apk

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci-*.java'
      - 'ci-*.xml'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Capacitor
        run: |
          npm init -y
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: 初始化安卓工程
        run: |
          mkdir -p www
          echo '<!doctype html><meta charset=utf-8><title>查寝打卡</title>' > www/index.html
          npx cap init "查寝打卡" "com.zzu.checkin" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: 提高 minSdk 到 24
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          grep minSdkVersion android/variables.gradle

      - name: 添加 OCR 依赖
        run: |
          RAW=https://raw.githubusercontent.com/2025wst/zzu-checkin/main
          curl -fsSL -o /tmp/add_dep.py "$RAW/ci_add_dep.py"
          python3 /tmp/add_dep.py
          grep -A3 '^dependencies {' android/app/build.gradle

      - name: 拉取并写入源码
        run: |
          set -e
          RAW=https://raw.githubusercontent.com/2025wst/zzu-checkin/main
          D=android/app/src/main/java/com/zzu/checkin
          X=android/app/src/main/res/xml
          V=android/app/src/main/res/values
          mkdir -p "$D" "$X" "$V"
          curl -fsSL -o "$D/App.java" "$RAW/ci-App.java"
          curl -fsSL -o "$D/MainActivity.java" "$RAW/ci-MainActivity.java"
          curl -fsSL -o "$D/CheckinService.java" "$RAW/ci-CheckinService.java"
          curl -fsSL -o "$D/CheckinStatus.java" "$RAW/ci-CheckinStatus.java"
          curl -fsSL -o "$D/CheckinAlarm.java" "$RAW/ci-CheckinAlarm.java"
          curl -fsSL -o "$D/CheckinJob.java" "$RAW/ci-CheckinJob.java"
          curl -fsSL -o "$D/BootReceiver.java" "$RAW/ci-BootReceiver.java"
          curl -fsSL -o "$D/Notify.java" "$RAW/ci-Notify.java"
          curl -fsSL -o "$D/DeviceProfile.java" "$RAW/ci-DeviceProfile.java"
          curl -fsSL -o "$D/OcrFinder.java" "$RAW/ci-OcrFinder.java"
          curl -fsSL -o "$V/strings_checkin.xml" "$RAW/ci-strings_checkin.xml"
          curl -fsSL -o "$X/accessibility_service_config.xml" "$RAW/ci-accessibility_service_config.xml"
          curl -fsSL -o android/app/src/main/AndroidManifest.xml "$RAW/ci-AndroidManifest.xml"
          echo '--- 写入结果 ---'
          ls -l "$D"
          grep -c queries android/app/src/main/AndroidManifest.xml

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 检查产物
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: checkin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Release（免登录下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: checkin-latest
          name: 查寝打卡 · 最新构建
          body: 由 GitHub Actions 自动构建
          files: android/app/build/outputs/apk/debug/app-debug.apk
